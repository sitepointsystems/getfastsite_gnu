services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      # Always re-pull the base image instead of reusing one already on the
      # server. The floating php:8.3-fpm-alpine tag is only "latest" if the
      # build actually fetches it: Coolify Force-deploy-without-cache clears
      # the LAYER cache, not the base image. Measured 2026-10-21 during
      # CVE-2026-109618/109619, when the local daemon happily served a
      # three-week-old 8.3.35 base.
      pull: true
      args:
        # private (default) | public — set FLAVOR=public in the deploy env
        # to build the open-source flavor.
        FLAVOR: ${FLAVOR:-private}
    expose:
      - "8080"
    environment:
      - APP_ENV=production
      - APP_URL=${APP_URL}
      - APP_SECRET=${APP_SECRET}
      - DATA_PATH=/data
      - REDIS_URL=tcp://redis:6379
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-fastsite}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-engine@fastsite.local}
    volumes:
      - fastsite-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fastsite-redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  fastsite-data:
  fastsite-redis:
