; 1G, not 512M: the build streams per locale now, but a big multilingual
; site's translated bodies + media metadata still deserve headroom — an
; OOM-killed worker reads as "Reclaimed after a stale heartbeat" and burns
; job attempts with no error trail.
memory_limit = 1024M
upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 120
expose_php = Off

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
