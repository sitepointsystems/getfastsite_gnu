[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; FOUR queue workers: dedicated lanes for build / translate / media plus a
; general worker for high/default/low — a translation backlog or a long
; optimize run can never starve builds. All run as www-data — the /data
; SQLite tree is owned by www-data. Job claiming is an atomic guarded
; UPDATE and write-heavy handlers take the per-site lock, so concurrent
; workers are safe by construction (plan §queue).
[program:queue-work]
command=php /app/bin/fastsite queue:work --queues=high,default,low
numprocs=1
user=www-data
autorestart=true
; any start counts as successful — a Redis outage must never drive us FATAL
startsecs=0
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-work-build]
command=php /app/bin/fastsite queue:work --queues=build
numprocs=1
user=www-data
autorestart=true
startsecs=0
; the graceful drain must outlast a publish: each git subprocess may
; legally take up to 300s — SIGKILLing mid-push corrupts nothing but
; wastes a whole build cycle
stopwaitsecs=330
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; TWO translate workers: a chunk now holds the per-site lock, so the second
; worker never duplicates the first's work on the same site — it picks up a
; DIFFERENT site's chunk (a lock-busy claim requeues without burning an
; attempt). One customer's 700-item backlog no longer means every other site
; waits behind it. Within a single site, throughput comes from the site's own
; translate_concurrency (calls in flight), not from more workers.
[program:queue-work-translate]
command=php /app/bin/fastsite queue:work --queues=translate
process_name=%(program_name)s_%(process_num)02d
numprocs=2
user=www-data
autorestart=true
startsecs=0
; a killed chunk is stale-sweep-reclaimed; the skip-scan retry is idempotent
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-work-media]
command=php /app/bin/fastsite queue:work --queues=media
numprocs=1
user=www-data
autorestart=true
startsecs=0
; optimized_at is stamped per image — a retried chunk never re-spends credits
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:schedule-run]
command=php /app/bin/fastsite schedule:run
user=www-data
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
