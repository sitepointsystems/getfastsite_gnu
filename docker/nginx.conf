worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 512m;

    # Behind Coolify's Traefik proxy the immediate peer is the proxy's
    # container IP, so REMOTE_ADDR would be a single constant for every
    # external client — collapsing the per-IP rate-limit into one global
    # counter (platform-wide 429 lockout). Recover the real client IP from
    # X-Forwarded-For, but ONLY trust the private Docker/overlay ranges the
    # proxy actually sits in — trusting wider would let clients spoof XFF to
    # mint unlimited buckets. real_ip_recursive walks XFF right-to-left to
    # the last hop outside the trusted set (the true client).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    # Cloudflare's edge, for any host proxied through it (app.getfastsite.com
    # is, so the maintenance Worker can run). Without these the address
    # Traefik forwards is a Cloudflare edge IP, which is not private — so
    # real_ip_recursive would stop there and treat every visitor on that edge
    # as ONE client. That is the same global 429 lockout described above,
    # arriving by a different route: login, the per-IP form throttle and the
    # API limiter would all collapse into a single shared bucket.
    # Source: https://www.cloudflare.com/ips/ — stable for years, but re-check
    # it if rate limiting ever starts behaving oddly for proxied hosts.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # temp paths writable by www-data (nginx runs unprivileged)
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /app/public;
        index index.php;

        # JSON API: small body cap. Media upload routes raise it on their own
        # location block, immediately below.
        location /api/v1/ {
            client_max_body_size 4m;
            try_files $uri /index.php$is_args$args;
        }

        # Media and file uploads are the one API surface with real payloads, and
        # MediaService already enforces the per-type ceilings itself (15 MB
        # image, 100 MB generic file, 500 MB video) — so these routes keep the
        # 512m server default instead of the JSON cap above.
        #
        # Without this the cap above swallowed them, and the comment there
        # claimed a block that did not exist. Measured against production on
        # 2026-10-22: a 5 MB body to /api/v1/sites/{site}/media was cut off by
        # nginx at 4,210,688 bytes with a 413, so a REST upload could never
        # reach even the 15 MB image limit — and a base64 body, being 4/3 the
        # size of the file, died at roughly 3 MB of actual image.
        #
        # A REGEX location is what makes this work: it wins over the `/api/v1/`
        # prefix match, where the only prefix specific enough to beat it would
        # be `/api/v1/sites/` — which would raise the cap for every site route
        # rather than the uploads. Regex locations are tried in source order, so
        # this must stay ABOVE `location ~ /\.`.
        location ~ ^/api/v1/sites/[^/]+/media {
            client_max_body_size 512m;
            try_files $uri /index.php$is_args$args;
        }

        # RFC 8414 / RFC 9728 discovery lives under /.well-known/, which the
        # dotfile deny below would otherwise 403 — breaking MCP OAuth client
        # registration ("couldn't register"). `^~` beats the regex location,
        # so this must stay ABOVE `location ~ /\.`.
        location ^~ /.well-known/ {
            try_files $uri /index.php$is_args$args;
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 120s;
        }

        location ~ /\. {
            deny all;
        }
    }
}
