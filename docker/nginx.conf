worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 512m;

    # Behind Coolify's Traefik proxy the immediate peer is the proxy's
    # container IP, so REMOTE_ADDR would be a single constant for every
    # external client — collapsing the per-IP rate-limit into one global
    # counter (platform-wide 429 lockout). Recover the real client IP from
    # X-Forwarded-For, but ONLY trust the private Docker/overlay ranges the
    # proxy actually sits in — trusting wider would let clients spoof XFF to
    # mint unlimited buckets. real_ip_recursive walks XFF right-to-left to
    # the last hop outside the trusted set (the true client).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # temp paths writable by www-data (nginx runs unprivileged)
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /app/public;
        index index.php;

        # JSON API: small body cap. Media upload routes (M4) raise this on
        # their own location block; the 512m server default stays for those.
        location /api/v1/ {
            client_max_body_size 4m;
            try_files $uri /index.php$is_args$args;
        }

        # RFC 8414 / RFC 9728 discovery lives under /.well-known/, which the
        # dotfile deny below would otherwise 403 — breaking MCP OAuth client
        # registration ("couldn't register"). `^~` beats the regex location,
        # so this must stay ABOVE `location ~ /\.`.
        location ^~ /.well-known/ {
            try_files $uri /index.php$is_args$args;
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 120s;
        }

        location ~ /\. {
            deny all;
        }
    }
}
